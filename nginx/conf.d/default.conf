# Clariva Web - nginx configuration (see docs/clariva/DEPLOY.md).
#
# The image serves the static build in /usr/share/nginx/html (symlink to /app). TLS, HSTS and the public host name are
# expected to be handled by the reverse proxy / load balancer in front of this container.

# --- Cache policy -----------------------------------------------------------------------------------------------------
# One map instead of per-location add_header directives (nginx drops every inherited add_header as soon as a location
# defines its own, which would silently lose the security headers below). An empty value means "do not send the header".
map $uri $clariva_cache_control {
    default                                        "";
    # Entry point, version stamp, runtime config (config.json and config.<hostname>.json), the service worker and the
    # embedded pages must always be revalidated so a new deployment (or a config change) is picked up immediately.
    ~^/(index\.html|version|sw\.js|manifest\.json|home\.html|welcome\.html)$   "no-cache";
    ~^/config                                      "no-cache";
    # Element Call's own entry point and runtime config (also reached as /element-call/ via the index and the SPA fallback,
    # where $uri is already /element-call/index.html): its JS/CSS file names are hashed, so index.html must be revalidated
    # to pick up a new Element Call build, and config.json carries the homeserver / LiveKit endpoints.
    ~^/element-call/index\.html$                   "no-cache";
    ~^/element-call/config\.json$                  "no-cache";
    # Webpack output lives in bundles/<hash>/ and Element Call assets are content-hashed: safe to cache for a year.
    ~^/bundles/                                    "public, max-age=31536000, immutable";
    ~^/element-call/assets/                        "public, max-age=31536000, immutable";
    # Brand images, icons and fonts keep their names between releases: one day.
    ~^/(themes|vector-icons|welcome|decoder-ring|media|fonts)/    "public, max-age=86400";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # TLS is terminated in front of this container: keep redirects relative (Location: /#/user/...) so the browser stays
    # on its https origin instead of being sent to an absolute http:// URL built from the local connection.
    absolute_redirect off;

    # --- Headers --------------------------------------------------------------------------------------------------------
    add_header Cache-Control $clariva_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # strict-origin-when-cross-origin, not no-referrer: Google Identity Services and Razorpay need the embedding origin in the
    # Referer of their iframes (see docs/clariva/DEPLOY.md section 5). Only the origin is sent cross-origin, never a path.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The page CSP is the <meta> tag in index.html (it already allows Razorpay and Google Identity Services). Only
    # frame-ancestors cannot be set from a meta tag, so it is sent as a header; both policies apply.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    # --- Static app -----------------------------------------------------------------------------------------------------
    # The app is a hash-routed SPA served from the site root and references its assets by *relative* URL, so a blind
    # "serve index.html for everything" fallback would break (/some/path/ would look for /some/path/bundles/...).
    # Page navigations to unknown paths are sent to the app root instead; missing assets stay 404.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        if ($http_accept ~* "text/html") {
            return 302 /;
        }
        return 404;
    }

    # --- User deep link: https://<web-origin>/u/<mxid>  ->  /#/user/<mxid> --------------------------------------------
    # This is the link inside the QR code / "Share link" of the Android app (https://clarivahub.com/u/<percent-encoded
    # mxid>). The in-app side (profile view, surviving the sign-in) is src/clariva/qr/deepLink.ts.
    # $request_uri is the RAW (still percent-encoded) URI and the allowed character set below cannot contain CR/LF:
    # never build the redirect from $uri or $1, which are percent-DECODED (response splitting).
    location ^~ /u/ {
        if ($request_uri ~ "^/u/(?<clariva_mxid>[A-Za-z0-9%._~:@=+/-]+)") {
            return 302 "/#/user/$clariva_mxid";
        }
        return 302 /;
    }

    # --- Element Call (voice / video) -----------------------------------------------------------------------------------
    # Static build of Element Call 0.16.x (res/element-call, copied into the bundle by webpack.config.js). It is a SPA
    # that routes inside its own directory. Serving it from the web app's own origin (this block) is fine for dev /
    # staging; the production hardening step is a dedicated origin (`element_call.url`), see docs/clariva/DEPLOY.md,
    # "Element Call". That origin needs its OWN server block: this file's X-Frame-Options "SAMEORIGIN" and
    # frame-ancestors 'self' above would stop the web app (another origin) from framing it, and it must send
    # frame-ancestors https://<web origin> instead. EC's index.html has one inline script (`window.global = window;`):
    # a script-src on that origin needs its sha256 or 'unsafe-inline' (hash in DEPLOY.md section 7).
    location /element-call/ {
        try_files $uri $uri/ @element_call_spa;
    }

    location @element_call_spa {
        # serve Element Call's own index.html (404 when the build is not present) without re-entering location matching
        rewrite ^ /element-call/index.html break;
    }

    # --- Clariva Wallet-API reverse proxy (optional) --------------------------------------------------------------------
    # Same-origin alternative to CORS. Not enabled by default: copy clariva-api-proxy.locations.example to
    # clariva-api-proxy.locations (next to this file) and set `clariva.api_base_url` to "/clariva-api" in config.json.
    include /etc/nginx/conf.d/clariva-*.locations;

    # Server errors show the static "unable to load" page of the app instead of the stock nginx page
    error_page   500 502 503 504  /static/unable-to-load.html;
}
