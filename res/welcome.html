<style type="text/css">
    /* we deliberately inline style here to avoid flash-of-CSS problems, and to avoid
 * voodoo where we have to set display: none by default
 *
 * Clariva: this page is only a fallback. config.clariva*.json sets `embedded_pages.login_for_welcome: true`, so the
 * Clariva sign-in form is the landing page (as on Android) and this file is not shown.
 */

    .mx_Parent {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 25px 35px;
        color: #2e2f32;
    }

    .mx_Logo {
        height: 96px;
        margin-top: 2px;
    }

    .mx_ButtonGroup {
        margin-top: 24px;
    }

    .mx_ButtonRow {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        margin: 12px 0 0;
    }

    .mx_ButtonRow > * {
        margin: 0 10px;
    }

    .mx_ButtonParent {
        display: flex;
        padding: 12px 24px;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        border-radius: 24px;
        min-width: 150px;
        box-sizing: border-box;
        text-decoration: none;
        color: #2e2f32 !important;
    }

    .mx_Header_title {
        font-size: 28px;
        font-weight: 700;
        line-height: 34px;
        margin: 20px 0 0;
    }

    .mx_Header_subtitle {
        font-size: 17px;
        font-weight: normal;
        margin: 8px 0 0;
    }

    .mx_ButtonSignIn {
        background-color: #1b1d22;
        color: white !important;
    }

    .mx_ButtonCreateAccount {
        background-color: #007a61;
        color: white !important;
    }

    @media only screen and (max-width: 480px) {
        .mx_ButtonRow {
            flex-direction: column;
        }

        .mx_ButtonRow > * {
            margin: 0 0 10px 0;
        }
    }
</style>

<div class="mx_Parent">
    <img src="$logoUrl" alt="Clariva" class="mx_Logo" />
    <h1 class="mx_Header_title">_t("welcome_to_element")</h1>
    <h4 class="mx_Header_subtitle">Private conversations. Real value.</h4>
    <div class="mx_ButtonGroup">
        <div class="mx_ButtonRow">
            <a href="#/login" class="mx_ButtonParent mx_ButtonSignIn">
                <div class="mx_ButtonLabel">_t("action|sign_in")</div>
            </a>
            <a href="#/register" class="mx_ButtonParent mx_ButtonCreateAccount">
                <div class="mx_ButtonLabel">_t("action|create_account")</div>
            </a>
        </div>
    </div>
</div>
